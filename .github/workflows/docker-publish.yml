name: Docker Publish

on:
  push:
    branches:
      - dsv4-a6000-opt
    tags:
      - "v*"
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cancel-stale:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cancel older in-progress runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for status in in_progress queued; do
            gh run list -R ${{ github.repository }} -w "${{ github.workflow }}" \
              --branch "${{ github.ref_name }}" \
              --status $status --json databaseId -q '.[].databaseId'
          done | while read -r id; do
            if [ "$id" != "${{ github.run_id }}" ]; then
              gh run cancel "$id" -R ${{ github.repository }} || true
            fi
          done

  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: "8.6"
            suffix: sm86
            tags: lazymio/vllm-backport:latest-sm86,lazymio/vllm-backport:latest
          - arch: "8.0"
            suffix: sm80
            tags: lazymio/vllm-backport:latest-sm80
          - arch: "8.9"
            suffix: sm89
            tags: lazymio/vllm-backport:latest-sm89
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/local/.ghcup /usr/share/swift
          sudo docker image prune -af
          df -h

      - uses: actions/checkout@v4

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ccache-dir
          key: ccache-${{ matrix.suffix }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ matrix.suffix }}-

      - uses: docker/setup-buildx-action@v3

      - name: Inject ccache into build
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          cache-map: |
            {
              "ccache-dir": "/root/.cache/ccache"
            }

      - uses: docker/login-action@v3
        with:
          username: lazymio
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        timeout-minutes: 320
        with:
          context: .
          file: docker/Dockerfile
          target: vllm-openai
          push: true
          tags: ${{ startsWith(github.ref, 'refs/tags/') && format('lazymio/vllm-backport:{0}-{1}', github.ref_name, matrix.suffix) || matrix.tags }}
          cache-from: type=registry,ref=lazymio/vllm-backport:buildcache-${{ matrix.suffix }}
          cache-to: type=registry,ref=lazymio/vllm-backport:buildcache-${{ matrix.suffix }},mode=max,compression=zstd,ignore-error=true
          build-args: |
            torch_cuda_arch_list=${{ matrix.arch }}
            max_jobs=3
            nvcc_threads=2
